<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Countdown Timers</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --text: #1c1c1e;
    --muted: #6e6e73;
    --accent: #5b6bff;
    --card: #f5f5f7;
    --border: #e5e5ea;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15171c;
      --text: #f5f5f7;
      --muted: #a1a1a6;
      --accent: #a8b6ff;
      --card: #1e2027;
      --border: #2c2e35;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  main {
    max-width: 420px;
    padding: 24px;
    text-align: center;
  }
  h1 { font-size: 1.6rem; margin-bottom: 0.25em; }
  p { color: var(--muted); margin-bottom: 2em; }
  .links {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  a.link-button {
    display: block;
    text-decoration: none;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    font-weight: 600;
    padding: 16px;
    border-radius: 12px;
  }
</style>
</head>
<body>
<main>
  <h1>Countdown Timers</h1>
  <p>A simple iOS app for counting down to the moments that matter.</p>
  <div class="links">
    <a class="link-button" href="privacy.html">Privacy Policy</a>
    <a class="link-button" href="support.html">Support</a>
  </div>
</main>
</body>
</html>
